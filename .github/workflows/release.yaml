name: Release Styrolite

on:
  # This workflow runs on every push to main to either open
  # a PR or publish the release.
  push:
    branches:
      - main

permissions:
  contents: read # Default token to read

jobs:
  release-plz-release:
    if: ${{ github.repository_owner == 'edera-dev' }}
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: release  # Environment for trusted publishing
    permissions:
      contents: write # Needed to write release artifacts
      id-token: write # Needed for trusted publishing
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # zizmor: ignore[stale-action-refs] -- pinned to stable branch

      - name: generate cultivator token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: "${{ secrets.EDERA_CULTIVATION_APP_ID }}"
          private-key: "${{ secrets.EDERA_CULTIVATION_APP_PRIVATE_KEY }}"
          # Scope to what release-plz's `release` command needs: create tags
          # and GitHub releases.
          permission-contents: write

      - name: Run release-plz
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"

  release-plz-pr:
    if: ${{ github.repository_owner == 'edera-dev' }}
    name: Release-plz PR
    runs-on: ubuntu-latest
    environment: release  # Environment for trusted publishing
    permissions:
      contents: write      # Needed to write release artifacts
      id-token: write      # Needed for trusted publishing
      pull-requests: write # Needed to create pull requests
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # zizmor: ignore[stale-action-refs] -- pinned to stable branch

      - name: generate cultivator token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: "${{ secrets.EDERA_CULTIVATION_APP_ID }}"
          private-key: "${{ secrets.EDERA_CULTIVATION_APP_PRIVATE_KEY }}"
          # Scope to what release-plz's `release-pr` command needs: push the
          # release branch (contents) and open/update the PR (pull-requests).
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-plz
        uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"
